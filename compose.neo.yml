name: amazon-asin-monitor-neo

services:
  timescaledb:
    image: ${TIMESCALEDB_IMAGE:-timescale/timescaledb:2.29.2-pg16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NEO_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${NEO_POSTGRES_PASSWORD:-neo_dev_only}
      POSTGRES_DB: ${NEO_POSTGRES_DATABASE:-amazon_asin_monitor}
      COMPETITOR_DATABASE: ${NEO_COMPETITOR_DATABASE:-amazon_competitor_monitor}
    ports:
      - '127.0.0.1:${NEO_POSTGRES_PORT:-5432}:5432'
    volumes:
      - neo_timescaledb_data:/var/lib/postgresql/data
      - ./packages/db/docker/init/010-bootstrap-databases.sh:/docker-entrypoint-initdb.d/010-bootstrap-databases.sh:ro
      - ./packages/db/docker/apply-baseline.sh:/docker-entrypoint-initdb.d/020-apply-baseline.sh:ro
      - ./packages/db/migrations/0000_baseline.sql:/opt/asin-monitor/0000_baseline.sql:ro
      - ./packages/db/docker/apply-timescale-aggregates.sh:/docker-entrypoint-initdb.d/030-apply-timescale-aggregates.sh:ro
      - ./packages/db/migrations/0001_timescale_aggregates.sql:/opt/asin-monitor/0001_timescale_aggregates.sql:ro
      - ./packages/db/docker/apply-timescale-storage-policies.sh:/docker-entrypoint-initdb.d/040-apply-timescale-storage-policies.sh:ro
      - ./packages/db/migrations/0002_timescale_storage_policies.sql:/opt/asin-monitor/0002_timescale_storage_policies.sql:ro
      # D4 follows the final Legacy snapshot import; it is an explicit upgrade.
      - ./packages/db/docker/apply-auth-maintenance.sh:/opt/asin-monitor/apply-auth-maintenance.sh:ro
      - ./packages/db/migrations/0003_auth_maintenance.sql:/opt/asin-monitor/0003_auth_maintenance.sql:ro
      # ASIN write policy is also an explicit post-import primary upgrade.
      - ./packages/db/docker/apply-asin-timestamp-policy.sh:/opt/asin-monitor/apply-asin-timestamp-policy.sh:ro
      - ./packages/db/migrations/0004_asin_timestamp_policy.sql:/opt/asin-monitor/0004_asin_timestamp_policy.sql:ro
      # Import group comparisons require this explicit primary-only upgrade.
      - ./packages/db/migrations/0005_import_group_collation.sql:/opt/asin-monitor/0005_import_group_collation.sql:ro
      - ./packages/db/migrations/0005_import_group_collation.rollback.sql:/opt/asin-monitor/0005_import_group_collation.rollback.sql:ro
      # Completed check operations must survive worker retries and Redis outages.
      - ./packages/db/docker/apply-variant-check-receipts.sh:/opt/asin-monitor/apply-variant-check-receipts.sh:ro
      - ./packages/db/migrations/0006_variant_check_receipts.sql:/opt/asin-monitor/0006_variant_check_receipts.sql:ro
      - ./packages/db/migrations/0006_variant_check_receipts.rollback.sql:/opt/asin-monitor/0006_variant_check_receipts.rollback.sql:ro
      # History text matching follows the verified 0005 comparison collation.
      - ./packages/db/migrations/0007_monitor_history_matching.sql:/opt/asin-monitor/0007_monitor_history_matching.sql:ro
      - ./packages/db/migrations/0007_monitor_history_matching.rollback.sql:/opt/asin-monitor/0007_monitor_history_matching.rollback.sql:ro
      # Status intervals are an explicit upgrade after the final snapshot and 0007.
      - ./packages/db/docker/apply-monitor-intervals.sh:/opt/asin-monitor/apply-monitor-intervals.sh:ro
      - ./packages/db/migrations/0008_monitor_interval_projection.sql:/opt/asin-monitor/0008_monitor_interval_projection.sql:ro
      - ./packages/db/migrations/0008_monitor_interval_projection.rollback.sql:/opt/asin-monitor/0008_monitor_interval_projection.rollback.sql:ro
      # Notification readers need equivalent country matching in both D6 databases.
      - ./packages/db/docker/apply-notification-country-collation.sh:/opt/asin-monitor/apply-notification-country-collation.sh:ro
      - ./packages/db/migrations/0009_notification_country_collation.sql:/opt/asin-monitor/0009_notification_country_collation.sql:ro
      - ./packages/db/migrations/0009_notification_country_collation.rollback.sql:/opt/asin-monitor/0009_notification_country_collation.rollback.sql:ro
      - ./packages/db/docker/apply-competitor-query-matching.sh:/opt/asin-monitor/apply-competitor-query-matching.sh:ro
      - ./packages/db/migrations/0010_competitor_query_matching.sql:/opt/asin-monitor/0010_competitor_query_matching.sql:ro
      - ./packages/db/migrations/0010_competitor_query_matching.rollback.sql:/opt/asin-monitor/0010_competitor_query_matching.rollback.sql:ro
      - ./packages/db/docker/apply-competitor-write-policy.sh:/opt/asin-monitor/apply-competitor-write-policy.sh:ro
      - ./packages/db/migrations/0011_competitor_write_policy.sql:/opt/asin-monitor/0011_competitor_write_policy.sql:ro
      - ./packages/db/migrations/0011_competitor_write_policy.rollback.sql:/opt/asin-monitor/0011_competitor_write_policy.rollback.sql:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    stop_grace_period: 30s

volumes:
  neo_timescaledb_data:
