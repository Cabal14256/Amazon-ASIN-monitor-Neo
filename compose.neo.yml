name: amazon-asin-monitor-neo

services:
  timescaledb:
    image: ${TIMESCALEDB_IMAGE:-timescale/timescaledb:2.29.2-pg16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NEO_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${NEO_POSTGRES_PASSWORD:-neo_dev_only}
      POSTGRES_DB: ${NEO_POSTGRES_DATABASE:-amazon_asin_monitor}
      COMPETITOR_DATABASE: ${NEO_COMPETITOR_DATABASE:-amazon_competitor_monitor}
    ports:
      - '127.0.0.1:${NEO_POSTGRES_PORT:-5432}:5432'
    volumes:
      - neo_timescaledb_data:/var/lib/postgresql/data
      - ./packages/db/docker/init/010-bootstrap-databases.sh:/docker-entrypoint-initdb.d/010-bootstrap-databases.sh:ro
      - ./packages/db/docker/apply-baseline.sh:/docker-entrypoint-initdb.d/020-apply-baseline.sh:ro
      - ./packages/db/migrations/0000_baseline.sql:/opt/asin-monitor/0000_baseline.sql:ro
      - ./packages/db/docker/apply-timescale-aggregates.sh:/docker-entrypoint-initdb.d/030-apply-timescale-aggregates.sh:ro
      - ./packages/db/migrations/0001_timescale_aggregates.sql:/opt/asin-monitor/0001_timescale_aggregates.sql:ro
      - ./packages/db/docker/apply-timescale-storage-policies.sh:/docker-entrypoint-initdb.d/040-apply-timescale-storage-policies.sh:ro
      - ./packages/db/migrations/0002_timescale_storage_policies.sql:/opt/asin-monitor/0002_timescale_storage_policies.sql:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    stop_grace_period: 30s

volumes:
  neo_timescaledb_data:
